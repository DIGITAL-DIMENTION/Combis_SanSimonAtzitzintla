<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E80BE">
<title>Panel del Dueño · Ruta San Simón (R-18)</title>
<meta name="robots" content="noindex, nofollow">

<!-- PWA -->
<link rel="manifest" href="manifest-dueno.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dueño R-18">

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>

<style>
  :root{
    --paper:#FAF7F0; --paper-2:#FFFFFF; --surface:#F4EEDC; --ink:#221B12; --ink-soft:#7C7261;
    --talavera:#0E80BE; --talavera-dark:#0A5F8E;
    --agave:#1E9E5A; --agave-dark:#147A43;
    --alerta:#E1483A; --alerta-bg:#FCE3DE;
    --cempasuchil:#F5900C; --cempasuchil-dark:#CB7208;
    --border:#E4DBC5;
    --shadow: 0 1px 2px rgba(34,27,18,0.05), 0 6px 16px -8px rgba(34,27,18,0.14);
    --shadow-md: 0 10px 30px -10px rgba(34,27,18,0.22);
  }
  *{ -webkit-tap-highlight-color: transparent; }
  body{ background:var(--paper); color:var(--ink); font-family:'Plus Jakarta Sans', sans-serif; }
  .font-display{ font-family:'Sora', sans-serif; letter-spacing:-.01em; }
  .font-mono{ font-family:'JetBrains Mono', monospace; }
  .placard{ background:var(--paper-2); border:1px solid var(--border); border-radius:1.25rem; box-shadow:var(--shadow); transition: box-shadow .3s ease, transform .3s ease; }
  #map{ height:280px; width:100%; background:var(--surface); }
  .leaflet-container{ font-family:'Plus Jakarta Sans', sans-serif; background:var(--surface) !important; }
  [data-lucide]{ width:18px; height:18px; stroke-width:2.1; }

  .btn-lift{ transition: all .25s cubic-bezier(.2,.8,.2,1); }
  .btn-lift:hover{ transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .btn-lift:active{ transform: translateY(0) scale(.97); }

  .status-dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .status-dot.on{ background:var(--agave); box-shadow:0 0 0 3px color-mix(in srgb, var(--agave) 25%, transparent); }
  .status-dot.off{ background:var(--ink-soft); opacity:.5; }

  .driver-row{ border-bottom:1px solid var(--border); transition: background-color .2s ease; }
  .driver-row:last-child{ border-bottom:none; }
  .driver-row:hover{ background:var(--surface); }

  .alert-card{ border:1.5px solid var(--alerta); background:var(--alerta-bg); border-radius:1.1rem; transition: all .3s ease; }
  .alert-card.resolved{ border-color:var(--border); background:var(--paper-2); opacity:.7; }

  @keyframes flash{
    0%, 100%{ background-color:var(--alerta-bg); }
    50%{ background-color:#F5B7AC; }
  }
  .alert-card.flashing{ animation: flash 1s ease-in-out 3; }

  #alarmBar{ display:none; }
  #alarmBar.show{ display:flex; }
  @keyframes alarmPulse{
    0%, 100%{ opacity:1; }
    50%{ opacity:.6; }
  }
  #alarmBar.show{ animation: alarmPulse 1s ease-in-out infinite; }

  #installBtn.show{ display:flex; }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; animation: none !important; }
  }
</style>
</head>
<body class="font-body pb-10">

<!-- PANTALLA DE PIN -->
<div id="pinScreen" class="min-h-screen flex items-center justify-center px-6">
  <div class="placard p-7 w-full max-w-sm text-center">
    <div class="w-14 h-14 rounded-2xl mx-auto mb-3 flex items-center justify-center" style="background:linear-gradient(155deg, var(--talavera) 0%, var(--talavera-dark) 100%); color:#fff;">
      <i data-lucide="key-round"></i>
    </div>
    <h1 class="font-display font-semibold text-xl">Panel del Dueño</h1>
    <p class="text-sm mt-1" style="color:var(--ink-soft);">Ruta San Simón · R-18</p>
    <input id="pinInput" type="password" inputmode="numeric" placeholder="PIN"
           class="mt-5 w-full text-center text-2xl font-mono py-3 rounded-2xl border"
           style="background:var(--surface); border-color:var(--border); color:var(--ink);">
    <p id="pinError" class="text-sm mt-2 hidden" style="color:var(--alerta);">PIN incorrecto, intenta otra vez.</p>
    <button id="pinSubmit" class="btn-lift mt-4 w-full py-3 rounded-2xl font-display font-semibold" style="background:linear-gradient(155deg, var(--talavera) 0%, var(--talavera-dark) 100%); color:#fff;">Entrar</button>
  </div>
</div>

<!-- BARRA DE ALARMA (aparece cuando hay una alerta pendiente) -->
<div id="alarmBar" class="fixed top-0 inset-x-0 z-[80] items-center justify-between gap-3 px-4 py-3" style="background:linear-gradient(155deg, var(--alerta) 0%, #A9382C 100%); color:#fff;">
  <span class="font-display font-semibold text-sm flex items-center gap-2"><i data-lucide="siren" class="w-4 h-4"></i> Alerta de ayuda activa</span>
  <button id="silenceBtn" class="btn-lift text-xs font-semibold px-3 py-1.5 rounded-full" style="background:rgba(255,255,255,.2);">Silenciar</button>
</div>

<!-- PANEL PRINCIPAL -->
<div id="mainScreen" class="hidden max-w-md mx-auto px-4 pt-6 space-y-4">
  <header class="flex items-center justify-between mb-2 gap-2">
    <a href="index.html" aria-label="Volver al menú" class="btn-lift flex items-center justify-center w-9 h-9 rounded-full shrink-0" style="background:var(--paper-2); border:1px solid var(--border); color:var(--ink);">
      <i data-lucide="arrow-left" class="w-4 h-4"></i>
    </a>
    <div class="text-center flex-1">
      <h1 class="font-display font-semibold text-xl">Panel del Dueño</h1>
      <p class="text-sm" style="color:var(--ink-soft);">Ruta San Simón · R-18</p>
    </div>
    <button id="installBtn" aria-label="Instalar app" class="btn-lift hidden items-center gap-1.5 px-3.5 h-9 rounded-full font-display font-semibold text-[12px] shrink-0" style="background:linear-gradient(155deg, var(--cempasuchil) 0%, var(--cempasuchil-dark) 100%); color:#fff;">
      <i data-lucide="download" class="w-3.5 h-3.5"></i> Instalar
    </button>
  </header>

  <div id="firebaseWarning" class="hidden placard p-4 text-sm text-center" style="border-color:var(--alerta); background:var(--alerta-bg); color:var(--alerta);">
    Firebase no está configurado todavía (archivo firebase-config.js).
  </div>

  <!-- CONDUCTORES -->
  <section class="placard p-4">
    <div class="flex items-center justify-between mb-1.5 flex-wrap gap-1">
      <h2 class="font-display font-semibold text-sm uppercase tracking-wide flex items-center gap-1.5" style="color:var(--ink-soft);"><i data-lucide="users" class="w-4 h-4"></i> Conductores</h2>
      <span id="driversOnlineCount" class="text-[11px] font-mono" style="color:var(--ink-soft);">—</span>
    </div>
    <div id="driversList" class="divide-y" style="border-color:var(--border);"></div>
  </section>

  <!-- MAPA -->
  <section class="placard overflow-hidden">
    <div id="map"></div>
  </section>

  <!-- ALERTAS -->
  <section>
    <h2 class="font-display font-semibold text-sm uppercase tracking-wide mb-2 flex items-center gap-1.5" style="color:var(--ink-soft);"><i data-lucide="bell" class="w-4 h-4"></i> Alertas de ayuda</h2>
    <div id="alertsEmpty" class="placard p-4 text-sm text-center flex items-center justify-center gap-1.5" style="color:var(--ink-soft);">
      <i data-lucide="check-circle-2" class="w-4 h-4"></i> No hay alertas por ahora.
    </div>
    <div id="alertsList" class="space-y-2.5"></div>
  </section>
</div>

<script>
const pinScreen = document.getElementById('pinScreen');
const mainScreen = document.getElementById('mainScreen');
const pinInput = document.getElementById('pinInput');
const pinError = document.getElementById('pinError');
let map;
const driverMarkers = {}; // driverId -> L.marker

function unlock(){
  pinScreen.classList.add('hidden');
  mainScreen.classList.remove('hidden');
  initMap();
  initFirebaseListeners();
  requestNotificationPermission();
  if (window.lucide) lucide.createIcons();
}

if (window.lucide) lucide.createIcons();

if (localStorage.getItem('rss_panel_unlocked') === 'true') {
  unlock();
}

document.getElementById('pinSubmit').addEventListener('click', tryPin);
pinInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryPin(); });

function tryPin(){
  const expected = (typeof PANEL_PIN !== 'undefined') ? PANEL_PIN : null;
  if (expected !== null && pinInput.value === expected) {
    localStorage.setItem('rss_panel_unlocked', 'true');
    pinError.classList.add('hidden');
    unlock();
  } else {
    pinError.classList.remove('hidden');
  }
}

function initMap(){
  map = L.map('map', { zoomControl: true, attributionControl: false }).setView([19.272, -98.455], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
  L.control.attribution({ prefix: false })
    .addAttribution('© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>')
    .addTo(map);
}

function driverIcon(route){
  const color = route === 'secundaria' ? '#1E9E5A' : (route === 'capilla' ? '#F5900C' : '#2C9E4A');
  return L.divIcon({
    className: '',
    html: `<div style="width:32px;height:32px;border-radius:50%;background:${color};border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 2px 6px rgba(0,0,0,.4);">🚐</div>`,
    iconSize: [32, 32],
    iconAnchor: [16, 16],
  });
}

/* ============================================================
   ALARMA DE NOTIFICACIÓN
   Suena repetidamente y muestra una notificación del navegador
   mientras haya al menos una alerta "pendiente", hasta que el
   dueño la marque como atendida o presione "Silenciar".
   ============================================================ */
let audioCtx;
function beep(){
  try{
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    [0, 0.3, 0.6].forEach((delay) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = 880;
      const t0 = audioCtx.currentTime + delay;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.linearRampToValueAtTime(0.18, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.25);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.3);
    });
  } catch(e) {}
}

let alarmIntervalId = null;
let alarmSilenced = false;

function requestNotificationPermission(){
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission().catch(() => {});
  }
}

function showBrowserNotification(alert){
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    const n = new Notification('🆘 Alerta de ayuda · Ruta San Simón', {
      body: (alert && alert.driverName ? alert.driverName : 'Un conductor') + ' necesita ayuda.',
      tag: 'rss-panic-alert',
      requireInteraction: true,
    });
    n.onclick = () => { window.focus(); n.close(); };
  } catch (e) {}
}

function startAlarm(latestAlert){
  document.getElementById('alarmBar').classList.add('show');
  beep();
  showBrowserNotification(latestAlert);
  if (alarmIntervalId) return; // ya está sonando en bucle
  alarmIntervalId = setInterval(() => { if (!alarmSilenced) beep(); }, 4000);
}

function stopAlarm(){
  document.getElementById('alarmBar').classList.remove('show');
  if (alarmIntervalId) { clearInterval(alarmIntervalId); alarmIntervalId = null; }
  alarmSilenced = false;
}

document.getElementById('silenceBtn').addEventListener('click', () => {
  alarmSilenced = true;
  document.getElementById('alarmBar').classList.remove('show');
});

/* ============================================================
   FIREBASE: conductores + alertas de pánico
   ============================================================ */
let seenAlertIds = new Set();
let firstAlertsLoad = true;
let driverLocations = {};  // id -> data
let driverNames = {};      // id -> name

function initFirebaseListeners(){
  if (typeof db === 'undefined' || !db) {
    document.getElementById('firebaseWarning').classList.remove('hidden');
    return;
  }

  // --- Ubicación / estado de cada conductor ---
  db.ref('driverLocation').on('value', (snapshot) => {
    driverLocations = snapshot.val() || {};
    renderDrivers();
    renderMapMarkers();
  });

  // --- Nombres editables de cada conductor ---
  db.ref('drivers').on('value', (snapshot) => {
    driverNames = snapshot.val() || {};
    renderDrivers();
    renderMapMarkers();
  });

  // --- Alertas de ayuda ---
  db.ref('panicAlerts').orderByChild('createdAt').on('value', (snapshot) => {
    const alerts = [];
    snapshot.forEach((child) => {
      alerts.push({ id: child.key, ...child.val() });
    });
    alerts.reverse(); // más recientes primero

    const newPending = alerts.filter(a => a.status === 'pendiente' && !seenAlertIds.has(a.id));
    if (newPending.length && !firstAlertsLoad) {
      alarmSilenced = false;
      startAlarm(newPending[0]);
      if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
    }
    alerts.forEach(a => seenAlertIds.add(a.id));
    firstAlertsLoad = false;

    const anyPending = alerts.some(a => a.status === 'pendiente');
    if (!anyPending) stopAlarm();

    renderAlerts(alerts);
  });
}

function driverDefaultName(id){
  const list = (typeof DRIVERS !== 'undefined') ? DRIVERS : [];
  const found = list.find(d => d.id === id);
  return found ? found.name : id;
}

function driverDisplayName(id){
  if (driverNames[id] && driverNames[id].name) return driverNames[id].name;
  if (driverLocations[id] && driverLocations[id].driverName) return driverLocations[id].driverName;
  return driverDefaultName(id);
}

function driverRouteFor(id){
  if (driverNames[id] && driverNames[id].route) return driverNames[id].route;
  if (driverLocations[id] && driverLocations[id].route) return driverLocations[id].route;
  return null;
}

function routeLabel(route){
  if (route === 'capilla') return 'Por Capilla';
  if (route === 'secundaria') return 'Por Secundaria';
  return 'Sin ramal asignado';
}

function routeColor(route){
  if (route === 'capilla') return '#F5900C';
  if (route === 'secundaria') return '#1E9E5A';
  return 'var(--ink-soft)';
}

function allDriverIds(){
  const ids = new Set();
  const list = (typeof DRIVERS !== 'undefined') ? DRIVERS : [];
  list.forEach(d => ids.add(d.id));
  Object.keys(driverLocations).forEach(id => ids.add(id));
  Object.keys(driverNames).forEach(id => ids.add(id));
  return Array.from(ids);
}

function isDriverFresh(data){
  return !!(data && data.active && data.updatedAt && (Date.now() - data.updatedAt < 2 * 60 * 1000));
}

function renderDrivers(){
  const list = document.getElementById('driversList');
  const ids = allDriverIds();
  let onlineCount = 0;
  let capillaCount = 0;
  let secundariaCount = 0;
  list.innerHTML = '';

  ids.forEach((id) => {
    const data = driverLocations[id];
    const fresh = isDriverFresh(data);
    if (fresh) {
      onlineCount++;
      const r = driverRouteFor(id);
      if (r === 'capilla') capillaCount++;
      else if (r === 'secundaria') secundariaCount++;
    }
    const name = driverDisplayName(id);
    const updatedText = fresh
      ? 'Última actualización: ' + new Date(data.updatedAt).toLocaleTimeString('es-MX')
      : (data && data.updatedAt ? 'Última vez: ' + new Date(data.updatedAt).toLocaleString('es-MX') : 'Sin conexión aún');

    const row = document.createElement('div');
    row.className = 'driver-row py-3 flex items-center justify-between gap-2';
    const route = driverRouteFor(id);
    row.innerHTML = `
      <div class="min-w-0 flex items-center gap-2.5">
        <span class="w-8 h-8 rounded-full flex items-center justify-center shrink-0" style="background:color-mix(in srgb, var(--talavera) 14%, var(--paper-2)); color:var(--talavera);"><i data-lucide="user" class="w-4 h-4"></i></span>
        <div class="min-w-0">
          <p class="font-display font-semibold text-sm truncate">${name}</p>
          <p class="text-[11px] font-mono truncate" style="color:var(--ink-soft);">${updatedText}</p>
          <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full mt-1 inline-block" style="background:${routeColor(route)}; color:#fff;">${routeLabel(route)}</span>
        </div>
      </div>
      <span class="flex items-center gap-1.5 text-xs font-semibold shrink-0">
        <span class="status-dot ${fresh ? 'on' : 'off'}"></span> ${fresh ? 'En ruta' : 'Sin conexión'}
      </span>
    `;
    list.appendChild(row);
  });

  document.getElementById('driversOnlineCount').textContent =
    onlineCount + ' en ruta · ' + capillaCount + ' Capilla · ' + secundariaCount + ' Sec.';
  if (window.lucide) lucide.createIcons();
}

function renderMapMarkers(){
  if (!map) return;
  const ids = allDriverIds();

  ids.forEach((id) => {
    const data = driverLocations[id];
    const fresh = isDriverFresh(data);

    if (fresh) {
      const latlng = [data.lat, data.lng];
      const name = driverDisplayName(id);
      const route = driverRouteFor(id);
      const popupText = `${name} · ${routeLabel(route)}`;
      if (!driverMarkers[id]) {
        driverMarkers[id] = L.marker(latlng, { icon: driverIcon(route) }).addTo(map).bindPopup(popupText);
      } else {
        driverMarkers[id].setIcon(driverIcon(route)).setLatLng(latlng).setPopupContent(popupText);
      }
    } else if (driverMarkers[id]) {
      map.removeLayer(driverMarkers[id]);
      delete driverMarkers[id];
    }
  });

  // centra el mapa la primera vez que aparece algún conductor activo
  const activeLatLngs = Object.values(driverMarkers).map(m => m.getLatLng());
  if (activeLatLngs.length === 1 && !map._rssCentered) {
    map.setView(activeLatLngs[0], 15);
    map._rssCentered = true;
  }
}

function renderAlerts(alerts){
  const list = document.getElementById('alertsList');
  const empty = document.getElementById('alertsEmpty');
  list.innerHTML = '';

  if (!alerts.length) {
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  alerts.forEach((a) => {
    const isPending = a.status === 'pendiente';
    const time = a.createdAt ? new Date(a.createdAt).toLocaleString('es-MX') : '—';
    const mapsUrl = (a.lat != null && a.lng != null) ? `https://www.google.com/maps?q=${a.lat},${a.lng}` : null;
    const driverName = a.driverName || (a.driverId ? driverDisplayName(a.driverId) : 'Conductor');
    const alertRoute = a.route || (a.driverId ? driverRouteFor(a.driverId) : null);

    const card = document.createElement('div');
    card.className = 'alert-card p-4' + (isPending ? '' : ' resolved');
    card.innerHTML = `
      <div class="flex items-start justify-between gap-2">
        <div>
          <p class="font-display font-semibold text-sm flex items-center gap-1.5" style="color:${isPending ? 'var(--alerta)' : 'var(--ink-soft)'};">
            <i data-lucide="${isPending ? 'siren' : 'check-circle-2'}" class="w-4 h-4"></i> ${isPending ? 'Alerta activa' : 'Atendida'} · ${driverName}
          </p>
          <p class="text-xs font-mono mt-0.5" style="color:var(--ink-soft);">${time}${alertRoute ? ' · ' + routeLabel(alertRoute) : ''}</p>
        </div>
      </div>
      <div class="flex gap-2 mt-3.5">
        ${mapsUrl ? `<a href="${mapsUrl}" target="_blank" rel="noopener" class="btn-lift text-xs font-semibold px-3.5 py-2 rounded-full flex items-center gap-1.5" style="background:var(--talavera); color:#fff;"><i data-lucide="map-pin" class="w-3.5 h-3.5"></i> Ver ubicación</a>` : `<span class="text-xs" style="color:var(--ink-soft);">Sin ubicación</span>`}
        ${isPending ? `<button class="resolve-btn btn-lift text-xs font-semibold px-3.5 py-2 rounded-full" style="background:var(--agave); color:#fff;" data-id="${a.id}">Marcar atendida</button>` : ''}
      </div>
    `;
    list.appendChild(card);
  });

  list.querySelectorAll('.resolve-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      db.ref('panicAlerts/' + id).update({ status: 'atendida' }).catch(() => {});
    });
  });
  if (window.lucide) lucide.createIcons();
}

/* ============================================================
   PWA: INSTALACIÓN Y SERVICE WORKER
   ============================================================ */
let deferredInstallPrompt;
const installBtn = document.getElementById('installBtn');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  installBtn.classList.remove('hidden');
  installBtn.classList.add('show');
});

installBtn.addEventListener('click', async () => {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  installBtn.classList.add('hidden');
  installBtn.classList.remove('show');
});

window.addEventListener('appinstalled', () => {
  installBtn.classList.add('hidden');
  installBtn.classList.remove('show');
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => { /* offline no disponible */ });
  });
}
</script>
</body>
</html>
